image: debian/testing
packages:
  - build-essential
  - kyua
  - atf-sh
  - libatf-dev
  - autotools-dev
  - pkg-config
  - autoconf
  - automake
sources:
  - https://codeberg.org/mlmmj/mlmmj
tasks:
  - configure: |
      cd mlmmj
      autoreconf -if
      ./configure
  - build: |
      cd mlmmj
      make
  - test: |
      cd mlmmj
      make check || { kyua report --verbose; exit 1 ;}
